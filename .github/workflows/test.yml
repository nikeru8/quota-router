name: tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: ${{ matrix.os }} / Python ${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: python -m pip install -e . pytest
      - name: Test
        # -rsxX lists every skipped, xfailed and unexpectedly passing test with its reason.
        # QR_E2E_ONLINE=1: tests/test_fresh_machine.py runs a plain `pip install` in a new virtualenv,
        # which downloads setuptools for the build. Without it that test only installs from a local cache.
        env:
          QR_E2E_ONLINE: "1"
        run: python -m pytest -q -rsxX
      - name: Installed entry points
        # The console script and the module form must both start without a config file.
        run: |
          qr --help
          python -I -m quota_router --help
